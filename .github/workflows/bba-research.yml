
name: BBA Project Research

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bba-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project data
        run: python -m json.tool projects.json > /dev/null

      - name: Discover review-only candidates
        run: python scripts/discover_candidates.py

      - name: Install OpenAI SDK
        run: python -m pip install openai

      - name: Run BBA AI research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/bba_research.py

      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bba-research-review-${{ github.run_id }}
          path: |
            research-output/candidates.json
            research_candidates.json
          if-no-files-found: warn
          retention-days: 14
