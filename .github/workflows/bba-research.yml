name: BBA Project Research

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

concurrency:
  group: bba-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile scripts/bba_research.py

      - name: Install OpenAI SDK
        run: python -m pip install --upgrade openai

      - name: Run BBA AI research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1
        run: python scripts/bba_research.py

      - name: Confirm project data was not changed
        if: always()
        run: git diff --exit-code -- projects.json

      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bba-research-reports-${{ github.run_number }}
          path: |
            research_candidates.json
            research_diagnostics.json
          if-no-files-found: warn
          retention-days: 14
