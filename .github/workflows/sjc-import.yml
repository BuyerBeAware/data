name: BBA St Johns Import

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bba-sjc-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile scripts/sjc_import.py
      - name: Import official county records
        run: python scripts/sjc_import.py
      - name: Confirm published data unchanged
        if: always()
        run: git diff --exit-code -- projects.json
      - name: Upload county review and map test files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sjc-review-and-map-test-${{ github.run_number }}
          path: |
            research-output/sjc_candidates.json
            research-output/sjc_projects.test.json
          if-no-files-found: warn
          retention-days: 14
