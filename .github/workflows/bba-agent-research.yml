name: BBA Agent Research

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run BBA agents
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BBA_MAX_PAGES: '35'
          BBA_AI_MODEL: gpt-4.1-mini
        run: python scripts/bba_agents.py
      - name: Upload review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bba-agent-review
          path: research-output/*.json
          if-no-files-found: warn
          retention-days: 14
