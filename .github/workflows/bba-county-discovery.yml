name: BBA County Discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'
permissions:
  contents: read
concurrency:
  group: county-discovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        county: [FL-12109, FL-12035]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test county discovery
        run: python -m unittest discover -s scripts -p 'test_bba_county_discovery.py'
      - name: Restore historical rotation
        uses: actions/cache/restore@v4
        with:
          path: research-state
          key: county-history-v1-${{ matrix.county }}-${{ github.run_id }}
          restore-keys: county-history-v1-${{ matrix.county }}-
      - name: Discover public records and corroborating leads
        run: python scripts/bba_county_discovery.py --county '${{ matrix.county }}'
      - name: Preserve historical rotation
        if: always()
        uses: actions/cache/save@v4
        with:
          path: research-state
          key: county-history-v1-${{ matrix.county }}-${{ github.run_id }}
      - name: Preserve published feed
        if: always()
        run: git diff --exit-code -- projects.json
      - name: Upload county review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: county-discovery-${{ matrix.county }}
          path: research-output/county-discovery/*.json
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: discover
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test publication and regression gates
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/download-artifact@v4
        with:
          pattern: county-discovery-*
          path: research-output/county-discovery
          merge-multiple: true
      - name: Build complete validated beta feed
        run: python scripts/bba_publish_feed.py
      - name: Preserve production feed
        run: git diff --exit-code -- projects.json
      - name: Commit versioned feed and history
        run: |
          git config user.name 'BBA Feed Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- feeds/beta.json feeds/latest-publication.json feeds/history
          if ! git diff --cached --quiet; then
            git commit -m "Refresh validated BBA beta feed and preserve history"
            # Preserve unrelated commits made while discovery was running.
            # A real feed conflict fails closed; never force-push or reset main.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Upload publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-feed-publication
          path: feeds/latest-publication.json
          if-no-files-found: warn
          retention-days: 30

  discover-clay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Discover Clay official GIS and public leads
        run: python scripts/bba_county_discovery.py --county FL-12019
      - name: Preserve production and existing beta feed
        if: always()
        run: git diff --exit-code -- projects.json feeds/beta.json
      - name: Upload Clay review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: county-discovery-FL-12019
          path: research-output/county-discovery/*.json
          retention-days: 30
          if-no-files-found: error

  publish-clay:
    needs: [publish, discover-clay]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test Clay and legacy compatibility
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/download-artifact@v4
        with:
          name: county-discovery-FL-12019
          path: research-output/county-discovery
      - name: Publish three-county compatibility feed
        run: python scripts/bba_publish_clay.py
      - name: Audit evidence gaps and prioritize exact-record enrichment
        run: python scripts/bba_project_quality.py
      - name: Preserve existing clients and production
        run: git diff --exit-code -- projects.json feeds/beta.json
      - name: Commit v2 feed and durable history
        run: |
          git config user.name 'BBA Feed Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- feeds/beta-v2.json feeds/latest-publication-v2.json feeds/history-v2
          if ! git diff --cached --quiet; then
            git commit -m "Refresh validated three-county beta feed"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Upload v2 publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-feed-v2-publication
          path: |
            feeds/latest-publication-v2.json
            research-output/project-quality.json
          if-no-files-found: warn
          retention-days: 30
